name: Slash Test Repro

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  parse:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.perm.outputs.should_run }}
      pr_sha: ${{ steps.pr.outputs.pr_sha }}
    steps:
      - id: perm
        uses: actions/github-script@v7
        with:
          script: |
            const assoc = context.payload.comment.author_association;
            const allowed = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            core.setOutput('should_run', allowed.includes(assoc));

      - id: pr
        if: steps.perm.outputs.should_run == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('pr_sha', pr.data.head.sha);

  run:
    needs: parse
    if: needs.parse.outputs.should_run == 'true'
    uses: ./.github/workflows/reusable-test.yml
    with:
      ref: ${{ needs.parse.outputs.pr_sha }}
    secrets: inherit
